version: "3.9"

# Production-style stack: Postgres + FastAPI backend + Next.js frontend.
# For the fastest local start with zero setup, skip this file and follow the
# "Quick start (SQLite, no Docker)" instructions in README.md instead.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rang
      POSTGRES_PASSWORD: rang
      POSTGRES_DB: rang_intelligence
    ports:
      - "5432:5432"
    volumes:
      - rang_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://rang:rang@db:5432/rang_intelligence
      SECRET_KEY: change-me-in-production
      FRONTEND_ORIGIN: http://localhost:3000
      # ANTHROPIC_API_KEY: set this to enable LLM-backed recommendation narration
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.seed.demo_data || true && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  rang_db_data:
